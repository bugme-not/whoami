global
    log stdout format raw local0 warning
    maxconn 65535
    tune.bufsize 65536
    tune.rcvbuf.client 65536
    tune.rcvbuf.server 65536

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  tcp-smart-accept
    option  tcp-smart-connect

    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout tunnel          1h
    timeout client-fin      30s
    timeout server-fin      30s

frontend cloudrun_ingress
    bind *:8080

    acl is_health path -i /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    acl path_trojan path /imaohw
    acl path_vless path /whoami

    use_backend bk_trojan if path_trojan
    use_backend bk_vless if path_vless

    default_backend bk_custom_page

backend bk_trojan
    server xray 127.0.0.1:10000

backend bk_vless
    server xray 127.0.0.1:10001

backend bk_custom_page
    http-request return status 200 content-type "text/html; charset=utf-8" string "<!DOCTYPE html><html><head><title>whoiam?</title><meta name='viewport' content='width=device-width,initial-scale=1'></head><body style='margin:0;background:#000;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;'><div style='font-size:32px;font-weight:400;'>whoiam?</div></body></html>"
