version: "3.8"

services:
  aetherx:
    image: ima0hw/whoami:latest
    container_name: whoami
    network_mode: host
    restart: always
    pull_policy: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
